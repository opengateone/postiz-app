# OpenGate fork: build the Postiz image (with our additions) and push it to GHCR.
# New file only: upstream workflows stay untouched so syncing never conflicts here.
name: "OG Build Image"

on:
  push:
    branches: [og]
    tags: ['og-*']
  workflow_dispatch:
    inputs:
      platforms:
        description: 'linux/amd64 or linux/amd64,linux/arm64'
        default: 'linux/amd64'

concurrency:
  group: og-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    if: github.repository == 'opengateone/postiz-app'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Versions
        id: v
        run: |
          UPSTREAM=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || cat version.txt)
          echo "upstream=${UPSTREAM}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.dev
          platforms: ${{ inputs.platforms || 'linux/amd64' }}
          build-args: |
            NEXT_PUBLIC_VERSION=${{ steps.v.outputs.upstream }}-og.${{ steps.v.outputs.sha }}
          push: true
          provenance: false
          tags: |
            ${{ steps.v.outputs.image }}:og-${{ steps.v.outputs.sha }}
            ${{ steps.v.outputs.image }}:${{ steps.v.outputs.upstream }}-og.${{ github.run_number }}
            ${{ github.ref_type == 'tag' && format('{0}:{1}', steps.v.outputs.image, github.ref_name) || format('{0}:og-latest', steps.v.outputs.image) }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
